{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrar Usuario - Ferretería Rudy</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="pagina">

   <header class="parte-superior">
        <div class="contenido-superior">

            <a href="{% url 'catalogoUsuarios' %}" class="marca-ferreteria text-decoration-none text-white">
                <i class="bi bi-tools"></i>
                <span>FERRETERÍA RUDY</span>
            </a>

            <div class="usuario-sesion">
                <i class="bi bi-person-circle"></i>
                <span>{{ request.user.nombre }}</span>

                <form method="POST" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="cerrar-sesion" title="Cerrar Sesión" aria-label="Cerrar sesión">
                        <i class="bi bi-box-arrow-right" ></i></button>
                </form>
            </div>

        </div>
    </header>

    <main class="contenedor-principal">

        <h1 class="titulo-principal">{{ titulo }}</h1>

        <p class="descripcion-principal">
            Ingresa los datos de la nueva cuenta.
        </p>

        <div class="formulario-general">

            {% if error %}
                <div class="alert alert-danger">
                    {{ error }}
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre completo</label>
                    <input type="text"
                           class="form-control"
                           id="nombre"
                           name="nombre"
                           maxlength="100"
                           value="{{ request.POST.nombre }}"
                           required>
                </div>

                <div class="mb-3">
                    <label for="usuario" class="form-label">Nombre de usuario</label>
                    <input type="text"
                           class="form-control"
                           id="usuario"
                           name="usuario"
                           maxlength="50"
                           value="{{ request.POST.usuario }}"
                           required>
                </div>

                <div class="mb-3">
                    <label for="rol" class="form-label">Rol</label>
                    <select class="form-select" id="rol" name="rol" required>
                        <option value="">Seleccionar rol</option>

                        {% for valor, etiqueta in roles %}
                            <option value="{{ valor }}"
                                {% if request.POST.rol == valor %}selected{% endif %}>
                                {{ etiqueta }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>

                    <div class="input-group">
                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            required
                        >

                        <button
                            class="btn btn-outline-secondary"
                            type="button"
                            onclick="mostrarPassword('password', this)"
                            aria-label="Mostrar contraseña"
                        >
                            <i class="bi-eye-slash"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="confirmar_password" class="form-label">
                        Confirmar contraseña
                    </label>

                    <div class="input-group">
                        <input
                            type="password"
                            class="form-control"
                            id="confirmar_password"
                            name="confirmar_password"
                            required
                        >

                        <button
                            class="btn btn-outline-secondary"
                            type="button"
                            onclick="mostrarPassword('confirmar_password', this)"
                            aria-label="Mostrar contraseña"
                        >
                            <i class="bi-eye-slash"></i>
                        </button>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">
                        {{ accion }}
                    </button>

                    <a href="{% url 'catalogoUsuarios' %}"
                       class="btn btn-secondary">
                        Cancelar
                    </a>
                </div>

            </form>

        </div>

    </main>
    <script>
        function mostrarPassword(id, boton) {
            const campo = document.getElementById(id);
            const icono = boton.querySelector('i');

            if (campo.type === 'password') {
                campo.type = 'text';
                icono.classList.replace('bi-eye-slash', 'bi-eye');
                boton.setAttribute('aria-label', 'Ocultar contraseña');
            } else {
                campo.type = 'password';
                icono.classList.replace('bi-eye', 'bi-eye-slash');
                boton.setAttribute('aria-label', 'Mostrar contraseña');
            }
        }
    </script>

</body>
</html>
