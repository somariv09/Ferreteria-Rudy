
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agregar unidad - Ferretería Rudy</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="pagina">

    <header class="parte-superior">
        <div class="contenido-superior">

            <a href="{% url 'dashboard' %}" class="marca-ferreteria text-decoration-none text-white">
                <i class="bi bi-tools"></i>
                <span>FERRETERÍA RUDY</span>
            </a>

            <div class="usuario-sesion">
                <i class="bi bi-person-circle"></i>
                <span>{{ request.user.nombre }}</span>

                <form method="POST" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="cerrar-sesion" title="Cerrar Sesión" aria-label="Cerrar sesión">
                        <i class="bi bi-box-arrow-right"></i>
                    </button>
                </form>
            </div>

        </div>
    </header>

    <main class="contenedor-principal">

        <center>
            <h1 class="titulo-principal">Agregar unidad de medida</h1>

            <p class="descripcion-principal">
                Registra una nueva unidad de medida para el inventario.
            </p>
        </center>

        <section class="formulario-general">

            <form method="post" action="{% url 'agregarUnidad' %}">

                {% csrf_token %}

                {% if error %}
                    <div class="alert alert-danger">
                        {{ error }}
                    </div>
                {% endif %}

                <div class="mb-3">
                    <label for="nombre" class="form-label">
                        Nombre de la unidad
                    </label>

                    <input type="text" id="nombre" name="nombre"
                           class="form-control"
                           placeholder="Ejemplo: Metro"
                           maxlength="50" required>
                </div>

                <div class="mb-3">
                    <label for="abreviatura" class="form-label">
                        Abreviatura
                    </label>

                    <input type="text" id="abreviatura" name="abreviatura"
                           class="form-control"
                           placeholder="Ejemplo: m"
                           maxlength="15" required>
                </div>

                <div class="mb-3">
                    <label for="tipo" class="form-label">
                        Tipo de unidad
                    </label>

                    <select id="tipo" name="tipo" class="form-select" required>
                        <option value="">Seleccione un tipo</option>

                        {% for valor, etiqueta in tipos_unidad %}
                            <option value="{{ valor }}">{{ etiqueta }}</option>
                        {% endfor %}

                    </select>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">

                    <a href="{% url 'catalogoUnidades' %}" class="btn btn-secondary">
                        Cancelar
                    </a>

                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-check-lg"></i>
                        Guardar unidad
                    </button>

                </div>

            </form>

        </section>

    </main>

</body>
</html>
