
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar usuario - Ferretería Rudy</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="pagina">

    <!-- Encabezado -->
    <header class="parte-superior">

        <div class="contenido-superior">

            <div class="marca-ferreteria">
                <i class="bi bi-tools"></i>
                <span>FERRETERÍA RUDY</span>
            </div>

            <div class="usuario-sesion">
                <i class="bi bi-person-circle"></i>
                <span>{{ request.user.nombre }}</span>
            </div>

        </div>

    </header>

    <!-- Contenido principal -->
    <main class="contenedor-principal">

        <h1 class="titulo-principal">
            Editar usuario
        </h1>

        <p class="descripcion-principal">
            Modifica los datos de la cuenta seleccionada.
        </p>

        <div class="formulario-general">

            {% if error %}
                <div class="alert alert-danger" role="alert">
                    {{ error }}
                </div>
            {% endif %}

            <form method="post">

                {% csrf_token %}

                <!-- Nombre -->
                <div class="mb-3">

                    <label for="nombre" class="form-label">
                        Nombre completo
                    </label>

                    <input type="text"
                           class="form-control"
                           id="nombre"
                           name="nombre"
                           maxlength="100"
                           value="{% if request.method == 'POST' %}{{ request.POST.nombre }}{% else %}{{ usuario_editar.nombre }}{% endif %}"
                           required>

                </div>

                <!-- Nombre de usuario -->
                <div class="mb-3">

                    <label for="usuario" class="form-label">
                        Nombre de usuario
                    </label>

                    <input type="text"
                           class="form-control"
                           id="usuario"
                           name="usuario"
                           maxlength="50"
                           value="{% if request.method == 'POST' %}{{ request.POST.usuario }}{% else %}{{ usuario_editar.usuario }}{% endif %}"
                           required>

                </div>

                <!-- Rol -->
                <div class="mb-3">

                    <label for="rol" class="form-label">
                        Rol
                    </label>

                    <select class="form-select"
                            id="rol"
                            name="rol"
                            required>

                        {% for valor, etiqueta in roles %}

                            <option value="{{ valor }}"
                                {% if request.method == 'POST' %}
                                    {% if request.POST.rol == valor %}selected{% endif %}
                                {% elif usuario_editar.rol == valor %}
                                    selected
                                {% endif %}>

                                {{ etiqueta }}

                            </option>

                        {% endfor %}

                    </select>

                </div>

                <!-- Contraseña opcional -->
                <div class="mb-3">

                    <label for="password" class="form-label">
                        Nueva contraseña
                    </label>

                    <div class="input-group">
                        <input type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            autocomplete="new-password">

                        <button class="btn btn-outline-secondary"
                                type="button"
                                onclick="mostrarPassword('password', this)"
                                aria-label="Mostrar contraseña">
                            <i class="bi-eye-slash"></i>
                        </button>
                </div>

                <small class="text-muted">
                    Deja este campo vacío para conservar la contraseña actual.
                </small>

            </div>

            <!-- Botones -->
            <div class="d-flex gap-2 mt-4">

                <button type="submit"
                    class="btn btn-success">
                    Guardar cambios

                </button>

                <a href="{% url 'catalogoUsuarios' %}"
                    class="btn btn-secondary">
                    Cancelar
                </a>

            </div>

            </form>

        </div>

    </main>
    <script>
        function mostrarPassword(id, boton) {
            const campo = document.getElementById(id);
            const icono = boton.querySelector('i');

            if (campo.type === 'password') {
                campo.type = 'text';
                icono.classList.replace('bi-eye-slash', 'bi-eye');
                boton.setAttribute('aria-label', 'Ocultar contraseña');
            } else {
                campo.type = 'password';
                icono.classList.replace('bi-eye', 'bi-eye-slash');
                boton.setAttribute('aria-label', 'Mostrar contraseña');
            }
        }
    </script>

</body>
</html>
