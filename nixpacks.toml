[phases.setup]
aptPkgs = [
    "pkg-config",
    "default-libmysqlclient-dev",
    "libzstd1"
]

[phases.install]
cmds = [
    "export MYSQLCLIENT_CFLAGS='-I/usr/include/mysql -I/usr/include -std=c99' && export MYSQLCLIENT_LDFLAGS='-L/usr/lib/x86_64-linux-gnu -lmysqlclient' && python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install -r requirements.txt"
]




